<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pong Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: "Arial", sans-serif;
        color: white;
      }

      h1 {
        margin-bottom: 20px;
        font-size: 3rem;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      #gameCanvas {
        border: 4px solid white;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        background: #000;
      }

      .controls {
        margin-top: 20px;
        text-align: center;
      }

      .controls p {
        font-size: 1.2rem;
        margin: 10px 0;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
      }

      .controls button {
        margin: 10px 5px;
        padding: 10px 20px;
        font-size: 1rem;
        background: white;
        color: #667eea;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      }

      .controls button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 8px rgba(0, 0, 0, 0.3);
      }

      .controls button:active {
        transform: translateY(0);
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 2rem;
        }

        #gameCanvas {
          width: 90vw;
          height: 60vh;
        }
      }
    </style>
  </head>
  <body>
    <h1>🏓 Pong Game 🏓</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="controls">
      <p><strong>Player 1 (Left):</strong> W / S keys</p>
      <p><strong>Player 2 (Right):</strong> ↑ / ↓ arrow keys</p>
      <button id="resetBtn">Reset Game</button>
    </div>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const resetBtn = document.getElementById("resetBtn");

      // Game state
      let gameRunning = true;

      // Paddle properties
      const paddleWidth = 10;
      const paddleHeight = 100;
      const paddleSpeed = 5;

      // Player 1 (left paddle)
      const player1 = {
        x: 20,
        y: canvas.height / 2 - paddleHeight / 2,
        width: paddleWidth,
        height: paddleHeight,
        dy: 0,
        score: 0,
      };

      // Player 2 (right paddle)
      const player2 = {
        x: canvas.width - 20 - paddleWidth,
        y: canvas.height / 2 - paddleHeight / 2,
        width: paddleWidth,
        height: paddleHeight,
        dy: 0,
        score: 0,
      };

      // Ball properties
      const ball = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 8,
        speed: 5,
        dx: 5,
        dy: 5,
      };

      // Keyboard state
      const keys = {};

      // Event listeners for keyboard
      window.addEventListener("keydown", (e) => {
        keys[e.key] = true;
      });

      window.addEventListener("keyup", (e) => {
        keys[e.key] = false;
      });

      // Reset button
      resetBtn.addEventListener("click", resetGame);

      function resetGame() {
        player1.score = 0;
        player2.score = 0;
        resetBall();
        gameRunning = true;
      }

      function resetBall() {
        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;
        ball.dx = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
        ball.dy = (Math.random() - 0.5) * ball.speed * 2;
      }

      function drawRect(x, y, width, height, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, width, height);
      }

      function drawCircle(x, y, radius, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawText(text, x, y, color, font = "48px Arial") {
        ctx.fillStyle = color;
        ctx.font = font;
        ctx.textAlign = "center";
        ctx.fillText(text, x, y);
      }

      function drawNet() {
        for (let i = 0; i < canvas.height; i += 20) {
          drawRect(canvas.width / 2 - 2, i, 4, 10, "#ffffff44");
        }
      }

      function updatePaddles() {
        // Player 1 controls (W/S)
        if (keys["w"] || keys["W"]) {
          player1.dy = -paddleSpeed;
        } else if (keys["s"] || keys["S"]) {
          player1.dy = paddleSpeed;
        } else {
          player1.dy = 0;
        }

        // Player 2 controls (Arrow keys)
        if (keys["ArrowUp"]) {
          player2.dy = -paddleSpeed;
        } else if (keys["ArrowDown"]) {
          player2.dy = paddleSpeed;
        } else {
          player2.dy = 0;
        }

        // Update positions
        player1.y += player1.dy;
        player2.y += player2.dy;

        // Keep paddles within bounds
        if (player1.y < 0) player1.y = 0;
        if (player1.y + player1.height > canvas.height) {
          player1.y = canvas.height - player1.height;
        }

        if (player2.y < 0) player2.y = 0;
        if (player2.y + player2.height > canvas.height) {
          player2.y = canvas.height - player2.height;
        }
      }

      function updateBall() {
        ball.x += ball.dx;
        ball.y += ball.dy;

        // Top and bottom collision
        if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
          ball.dy *= -1;
        }

        // Paddle collision detection
        // Player 1 paddle (only when ball is moving left)
        if (
          ball.dx < 0 &&
          ball.x - ball.radius < player1.x + player1.width &&
          ball.x - ball.radius > player1.x &&
          ball.y > player1.y &&
          ball.y < player1.y + player1.height
        ) {
          ball.dx = Math.abs(ball.dx);
          // Add some angle variation based on where the ball hits
          const hitPos = (ball.y - player1.y) / player1.height;
          ball.dy = (hitPos - 0.5) * ball.speed * 2;
        }

        // Player 2 paddle (only when ball is moving right)
        if (
          ball.dx > 0 &&
          ball.x + ball.radius > player2.x &&
          ball.x + ball.radius < player2.x + player2.width &&
          ball.y > player2.y &&
          ball.y < player2.y + player2.height
        ) {
          ball.dx = -Math.abs(ball.dx);
          // Add some angle variation based on where the ball hits
          const hitPos = (ball.y - player2.y) / player2.height;
          ball.dy = (hitPos - 0.5) * ball.speed * 2;
        }

        // Score detection
        if (ball.x - ball.radius < 0) {
          player2.score++;
          resetBall();
        } else if (ball.x + ball.radius > canvas.width) {
          player1.score++;
          resetBall();
        }
      }

      function draw() {
        // Clear canvas
        drawRect(0, 0, canvas.width, canvas.height, "#000");

        // Draw net
        drawNet();

        // Draw paddles
        drawRect(player1.x, player1.y, player1.width, player1.height, "#fff");
        drawRect(player2.x, player2.y, player2.width, player2.height, "#fff");

        // Draw ball
        drawCircle(ball.x, ball.y, ball.radius, "#fff");

        // Draw scores
        drawText(player1.score.toString(), canvas.width / 4, 80, "#fff");
        drawText(player2.score.toString(), (canvas.width * 3) / 4, 80, "#fff");
      }

      function gameLoop() {
        if (gameRunning) {
          updatePaddles();
          updateBall();
        }
        draw();
        requestAnimationFrame(gameLoop);
      }

      // Start the game
      gameLoop();
    </script>
  </body>
</html>
